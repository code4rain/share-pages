# 공유관리 GitHub Pages mirror (generated by the 공유관리 app, v4.42+).
# Everything under _items/ and data/ is written by the app and is AES-256-GCM ciphertext only.
title: 공유관리
description: 키로 잠긴 개인 보관함
lang: ko-KR
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
color_scheme: light
search_enabled: false
heading_anchors: false
back_to_top: false
enable_copy_code_button: false
footer_content: "내용은 브라우저에서만 복호화됩니다."
collections:
  items:
    output: true
defaults:
  - scope:
      type: items
    values:
      layout: sm_item
      nav_exclude: true
      search_exclude: true
exclude:
  - tools/
  - README.md
  - Gemfile
  - Gemfile.lock
