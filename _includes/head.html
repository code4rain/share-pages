{%- comment -%}
  Override of just-the-docs v0.12.0 _includes/head.html:
  strict CSP first (no inline/external scripts, same-origin fetch only), no analytics, noindex, no referrer.
{%- endcomment -%}
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="sm-base" content="{{ site.baseurl }}">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <link rel="stylesheet" href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/just-the-docs-head-nav.css' | relative_url }}" id="jtd-head-nav-stylesheet">
  <style id="jtd-nav-activation">
  {% include css/activation.scss.liquid %}
  </style>
  <link rel="stylesheet" href="{{ '/assets/sm/sm.css' | relative_url }}">
  <script src="{{ '/assets/js/just-the-docs.js' | relative_url }}"></script>
  <script src="{{ '/assets/sm/app.js' | relative_url }}" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% include head_custom.html %}
</head>
